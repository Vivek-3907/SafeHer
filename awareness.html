<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafeHer | Awareness</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar container">
        <div class="brand">SafeHer</div>
        <div class="nav-links">
          <a href="./dashboard">Dashboard</a>
          <a href="./sos">SOS</a>
          <a href="./empowerment">Empowerment</a>
          <a href="./grievance">Forum</a>
        </div>
      </nav>
    </header>

    <main class="container page-shell">
      <section class="panel">
        <h1>Cyber Safety & Self Defense</h1>
        <div class="cards two-col">
          <div class="mini-card">
            <h3>Cyber safety</h3>
            <p>Save screenshots, preserve digital evidence, call 1930, and report to cybercrime.gov.in.</p>
          </div>
          <div class="mini-card">
            <h3>Self-defense tips</h3>
            <p>Protect vulnerable zones: eyes, throat, knees, and ears. Stay alert to exits and nearby help.</p>
          </div>
        </div>
      </section>
      <section class="panel">
        <h2>Safety quiz</h2>
        <div id="quizContainer"></div>
      </section>
    </main>

    <script src="./js/app.js"></script>
    <script src="./js/awareness.js"></script>
  </body>
</html>
