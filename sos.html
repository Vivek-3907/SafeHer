<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafeHer | SOS</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/safety.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar container">
        <div class="brand">SafeHer</div>
        <div class="nav-links">
          <a href="./dashboard">Dashboard</a>
          <a href="./grievance">Forum</a>
          <a href="./empowerment">Empowerment</a>
          <a href="./awareness">Awareness</a>
        </div>
      </nav>
    </header>

    <main class="container page-shell">
      <section class="panel hero-panel">
        <h1>Emergency SOS Center</h1>
        <div class="sos-controls">
          <button class="panic-btn large" id="sosButton">SOS</button>
          <button class="btn btn-secondary" id="cancelSos">Cancel</button>
        </div>
        <div id="countdownBox" class="countdown-box hidden">Alarm in <span id="countdown">5</span>s</div>
      </section>

      <section class="panel">
        <h2>Live location</h2>
        <p id="locationStatus">Fetching location…</p>
        <div id="map" class="map-box"></div>
      </section>

      <section class="panel">
        <h2>Emergency contacts</h2>
        <ul id="sosContacts" class="list-box"></ul>
      </section>
    </main>

    <script src="./js/app.js"></script>
    <script src="./js/sos.js"></script>
  </body>
</html>
