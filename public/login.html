<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafeHer | Login</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="auth-page">
    <div class="auth-shell">
      <div class="auth-card">
        <h1>Login to SafeHer</h1>
        <form id="loginForm">
          <label>Email
            <input type="email" id="loginEmail" value="SafeHer6705@gmail.com" required />
          </label>
          <label>Password
            <input type="password" id="loginPassword" value="SafeHer@#6705" required />
          </label>
          <button type="submit" class="btn btn-primary full-width">Login</button>
        </form>
        <div class="auth-links">
          <a href="./register">Create account</a>
          <a href="./">Home</a>
        </div>
        <p id="loginMessage" class="status-message"></p>
      </div>
    </div>

    <script src="./js/auth.js"></script>
  </body>
</html>
